# Optional: lets you write "@claude <request>" in an issue or PR comment and get a
# pull request back. Needs the Claude GitHub app installed on this repo and ONE of
# these repository secrets (Settings > Secrets and variables > Actions):
#   ANTHROPIC_API_KEY        - an Anthropic API key (pay per use), or
#   CLAUDE_CODE_OAUTH_TOKEN  - from `claude setup-token` (uses your Claude Pro/Max plan);
#                              then swap the two `with:` lines below.
# Until a secret is added, this workflow does nothing unless someone writes @claude.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
